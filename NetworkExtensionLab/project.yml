name: ByteTraceNetworkExtensionLab

options:
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""

targets:
  ByteTraceNetworkExtensionLab:
    type: application
    platform: macOS
    sources:
      - path: Host
      - path: Shared
    dependencies:
      - target: ByteTraceFilterProvider
        embed: true
      - sdk: NetworkExtension.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nanvon.ByteTrace.NetworkExtensionLab
        PRODUCT_NAME: ByteTraceNetworkExtensionLab
        INFOPLIST_FILE: Host/Info.plist
        CODE_SIGN_ENTITLEMENTS: Host/Host.entitlements
        GENERATE_INFOPLIST_FILE: NO

  ByteTraceFilterProvider:
    type: system-extension
    platform: macOS
    sources:
      - path: FilterProvider
      - path: Shared
    dependencies:
      - sdk: NetworkExtension.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nanvon.ByteTrace.NetworkExtensionLab.FilterProvider
        PRODUCT_NAME: ByteTraceFilterProvider
        PRODUCT_MODULE_NAME: ByteTraceFilterProvider
        INFOPLIST_FILE: FilterProvider/Info.plist
        CODE_SIGN_ENTITLEMENTS: FilterProvider/FilterProvider.entitlements
        GENERATE_INFOPLIST_FILE: NO
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-e"
          - "_NSExtensionMain"

  ByteTraceNetworkExtensionLabTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: Shared/FlowRecord.swift
    dependencies:
      - sdk: XCTest.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nanvon.ByteTrace.NetworkExtensionLabTests
        GENERATE_INFOPLIST_FILE: YES
