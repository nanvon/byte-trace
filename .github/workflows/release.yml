name: Release

# 发布打包与日常 CI 分离：只有推送与应用版本一致的 v* tag 才创建公开 Release。
on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Verify release version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check tag and app version
        run: python3 Scripts/check-release-version.py "${GITHUB_REF_NAME}"

      - name: Check release notes
        shell: bash
        run: |
          set -euo pipefail
          notes_path="release-notes/${GITHUB_REF_NAME}.md"
          if [[ ! -s "$notes_path" ]] || ! grep -q '[^[:space:]]' "$notes_path"; then
            echo "缺少 ${notes_path}；请在创建发布 tag 前补充面向用户的更新说明。" >&2
            exit 1
          fi

      - name: Check update signing configuration
        env:
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
        run: |
          if [[ -z "$SPARKLE_PUBLIC_ED_KEY" || -z "$SPARKLE_PRIVATE_ED_KEY" ]]; then
            echo "发布前必须配置 SPARKLE_PUBLIC_ED_KEY variable 和 SPARKLE_PRIVATE_ED_KEY secret。" >&2
            exit 1
          fi

  package:
    name: macOS Apple Silicon
    needs: prepare
    runs-on: xcode-27
    env:
      # 使用本地验收的工具链，只生成 Apple Silicon 产物。
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      BYTE_TRACE_SWIFT_TRIPLE: arm64-apple-macosx26.0
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Verify Xcode 27.1 and macOS 27.0 SDK
        run: |
          xcodebuild -version
          swift --version
          test "$(xcodebuild -version)" = $'Xcode 27.1\nBuild version 27A9275'
          test "$(xcrun --sdk macosx --show-sdk-version)" = "27.0"

      - name: Build and sign ad-hoc app bundle
        env:
          BYTE_TRACE_SIGNING_IDENTITY: "-"
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
        run: ./Scripts/package_app.sh

      - name: Name release archives
        id: archive
        env:
          ASSET_SUFFIX: macOS-Apple-Silicon
        run: |
          version="${GITHUB_REF_NAME#v}"
          zip_asset="dist/ByteTrace_${version}_${ASSET_SUFFIX}.zip"
          dmg_asset="dist/ByteTrace_${version}_${ASSET_SUFFIX}.dmg"
          zip_checksum="${zip_asset%.zip}.sha256"
          dmg_checksum="${dmg_asset%.dmg}.sha256"
          mv dist/ByteTrace.zip "$zip_asset"
          mv dist/ByteTrace.dmg "$dmg_asset"
          shasum -a 256 "$zip_asset" > "$zip_checksum"
          shasum -a 256 "$dmg_asset" > "$dmg_checksum"
          echo "zip_asset=$zip_asset" >> "$GITHUB_OUTPUT"
          echo "dmg_asset=$dmg_asset" >> "$GITHUB_OUTPUT"
          echo "zip_checksum=$zip_checksum" >> "$GITHUB_OUTPUT"
          echo "dmg_checksum=$dmg_checksum" >> "$GITHUB_OUTPUT"

      - name: Sign update archive, release notes and appcast
        env:
          TAG: ${{ github.ref_name }}
          UPDATE_ARCHIVE: ${{ steps.archive.outputs.zip_asset }}
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
        run: |
          python3 Scripts/generate-update-feed.py \
            --tag "$TAG" \
            --repository "$GITHUB_REPOSITORY" \
            --app dist/ByteTrace.app \
            --dist dist \
            --archive "$UPDATE_ARCHIVE" \
            --sign-update .build/artifacts/sparkle/Sparkle/bin/sign_update

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: byte-trace-macOS-Apple-Silicon
          path: |
            ${{ steps.archive.outputs.zip_asset }}
            ${{ steps.archive.outputs.zip_checksum }}
            ${{ steps.archive.outputs.dmg_asset }}
            ${{ steps.archive.outputs.dmg_checksum }}
            dist/appcast.xml
            dist/release-notes.md
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4

      - name: Compose release notes
        shell: bash
        run: |
          set -euo pipefail
          notes_path="release-notes/${GITHUB_REF_NAME}.md"
          if [[ ! -s "$notes_path" ]]; then
            echo "缺少 ${notes_path}" >&2
            exit 1
          fi
          # Release 正文 = 手写的本版更新说明 + 每版重复的固定尾注
          {
            cat "$notes_path"
            printf '\n---\n\nmacOS 产物使用 ad-hoc 签名且未经过 Apple 公证，首次打开可能需要在系统设置中手动放行。\n'
          } > "${RUNNER_TEMP}/release-notes.md"

      - name: Download signed packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: release-assets
        shell: bash
        run: |
          package_files=()
          while IFS= read -r -d '' file; do
            package_files+=("$file")
          done < <(find . -type f \( -name '*.zip' -o -name '*.dmg' \) -print0 | sort -z)
          if (( ${#package_files[@]} == 0 )); then
            echo "no package artifacts found under $(pwd)" >&2
            find . -type f -print >&2
            exit 1
          fi
          shasum -a 256 "${package_files[@]}" > SHA256SUMS.txt

      - name: Create release and upload assets
        working-directory: release-assets
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --draft \
            --title "ByteTrace ${GITHUB_REF_NAME}" \
            --notes-file "${RUNNER_TEMP}/release-notes.md"

          release_assets=()
          while IFS= read -r -d '' file; do
            release_assets+=("$file")
          done < <(find . -type f \( -name '*.zip' -o -name '*.dmg' -o -name '*.sha256' -o -name 'appcast.xml' -o -name 'release-notes.md' \) -print0 | sort -z)
          if (( ${#release_assets[@]} == 0 )); then
            echo "no release assets found under $(pwd)" >&2
            find . -type f -print >&2
            exit 1
          fi
          gh release upload "${GITHUB_REF_NAME}" "${release_assets[@]}" SHA256SUMS.txt \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber

          # 全部附件上传后才开放 latest/appcast，避免客户端看到尚未上传的 ZIP。
          gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft=false --latest
