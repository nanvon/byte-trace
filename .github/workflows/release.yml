name: Release

# 发布打包与日常 CI 分离：只有推送与应用版本一致的 v* tag 才创建公开 Release。
on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Verify release version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check tag and app version
        run: python3 Scripts/check-release-version.py "${GITHUB_REF_NAME}"

  package:
    name: ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            runner: macos-15
            triple: arm64-apple-macosx14.0
            asset_suffix: macOS-Apple-Silicon
          - name: macOS Intel
            runner: macos-15-intel
            triple: x86_64-apple-macosx14.0
            asset_suffix: macOS-Intel

    steps:
      - uses: actions/checkout@v4

      - name: Build and sign ad-hoc app bundle
        env:
          BYTE_TRACE_SIGNING_IDENTITY: "-"
          BYTE_TRACE_SWIFT_TRIPLE: ${{ matrix.triple }}
        run: ./Scripts/package_app.sh

      - name: Name release archive
        id: archive
        env:
          ASSET_SUFFIX: ${{ matrix.asset_suffix }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          asset="dist/ByteTrace_${version}_${ASSET_SUFFIX}.zip"
          mv dist/ByteTrace.zip "$asset"
          shasum -a 256 "$asset" > "${asset%.zip}.sha256"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: byte-trace-${{ matrix.asset_suffix }}
          path: |
            ${{ steps.archive.outputs.asset }}
            ${{ steps.archive.outputs.asset }}.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Download signed packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: release-assets
        run: |
          find . -maxdepth 1 -type f -name '*.zip' -print0 \
            | sort -z \
            | xargs -0 shasum -a 256 > SHA256SUMS.txt

      - name: Create release and upload assets
        working-directory: release-assets
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "ByteTrace ${GITHUB_REF_NAME}" \
            --notes "macOS 产物使用 ad-hoc 签名且未经过 Apple 公证，首次打开可能需要在系统设置中手动放行。" \
            --generate-notes
          gh release upload "${GITHUB_REF_NAME}" ./*.zip ./*.sha256 SHA256SUMS.txt \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
