name: CI

# CI 使用发布工具链检查 Apple Silicon 产物；不创建 Release。
#
# 结构：meta(ubuntu) / test(macOS) / package(macOS) 三个 job 并行执行。
# 原来一个 job 串行做「debug 构建 → 测试 → release 打包」，墙钟时间被串起来；
# 这里把互不依赖、也不传数据的阶段拆开并行，墙钟时间约等于最慢的一条。
#
# 文档类提交（仅改 README/*.md/docs/designs/LICENSE）不触发本流程。
#
# 注意（必需检查的坑）：现在仓库没有配置分支保护的必需检查，路径过滤是安全的。
# 如果以后把本工作流设为「Required status check」，工作流级 paths 过滤会让被跳过的
# 运行在 PR 上一直处于 Expected、卡住合并。届时应改成「始终运行一个轻量 gate job，
# 重型 job 用 dorny/paths-filter 条件跳过」，而不是在工作流级做 paths 过滤。
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '*.md'
      - 'docs/**'
      - 'designs/**'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '*.md'
      - 'docs/**'
      - 'designs/**'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  # 同一个 PR / 分支连续推送时，取消旧运行只跑最新的；
  # main 上不取消，确保发版的每个提交都完整跑过一遍。
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # 与本地 Xcode 保持一致，避免 runner 默认工具链变化影响系统界面样式。
  DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
  BYTE_TRACE_SWIFT_TRIPLE: arm64-apple-macosx26.0

jobs:
  # 不挑系统的纯脚本/元数据校验，放到 Ubuntu，别占用 macOS 名额。
  meta:
    name: Validate metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate packaging inputs
        run: |
          python3 Scripts/check-release-version.py
          bash -n Scripts/package_app.sh
          python3 -m py_compile Scripts/generate-update-feed.py

  # 测试 job：只编译测试与探针所需目标并跑全部测试。
  # ByteTraceApp 本身由下面 package job 以 release 配置编译（更严格），这里不再重复
  # debug 编译整个 App，避免把最重的 SwiftUI 目标放进关键路径。
  test:
    name: Build & test
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Verify Xcode 27.1 and macOS 27.0 SDK
        run: |
          xcodebuild -version
          swift --version
          test "$(xcodebuild -version)" = $'Xcode 27.1\nBuild version 27A9275'
          test "$(xcrun --sdk macosx --show-sdk-version)" = "27.0"

      # 只缓存依赖层（Sparkle 的 checkout / 二进制产物），相当于 setup-node / setup-go
      # 自带的依赖缓存；不缓存编译产物，避免占满 runner 磁盘。键只跟 Package.resolved
      # 走，依赖不变就命中同一份缓存，与源码改动无关。
      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: |
            .build/checkouts
            .build/artifacts
            .build/repositories
            ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-deps-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            swiftpm-deps-${{ runner.os }}-

      - name: Swift build (probe)
        run: swift build --product ByteTraceProbe --triple "$BYTE_TRACE_SWIFT_TRIPLE"

      - name: Swift tests
        run: swift test --triple "$BYTE_TRACE_SWIFT_TRIPLE"

  # release 构建 + ad-hoc 打包 + 产物校验。与上面的测试 job 相互独立，并行跑。
  package:
    name: Package app
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Verify Xcode 27.1 and macOS 27.0 SDK
        run: |
          xcodebuild -version
          swift --version
          test "$(xcodebuild -version)" = $'Xcode 27.1\nBuild version 27A9275'
          test "$(xcrun --sdk macosx --show-sdk-version)" = "27.0"

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: |
            .build/checkouts
            .build/artifacts
            .build/repositories
            ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-deps-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            swiftpm-deps-${{ runner.os }}-

      - name: Validate packaging inputs
        run: plutil -lint Packaging/Info.plist

      - name: Build local ad-hoc app bundle
        env:
          BYTE_TRACE_SIGNING_IDENTITY: "-"
        run: ./Scripts/package_app.sh

      - name: Validate generated packages
        run: |
          test -s dist/ByteTrace.zip
          test -s dist/ByteTrace.dmg
          test -d dist/ByteTrace.app/Contents/Frameworks/Sparkle.framework
          diskutil image info dist/ByteTrace.dmg >/dev/null
